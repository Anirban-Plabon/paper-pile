[project]
name = "paper-pile"
version = "0.1.0"
description = "Local markdown notes with built-in local AI (Ollama)."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "markdown-it-py==4.2.0",
    "markdownify==1.2.3",
    "mdit-py-plugins==0.6.1",
    "nicegui==3.18.0",
    "ollama==0.6.3",
    "pillow==12.3.0",
    "platformdirs==4.13.0",
    "pywebview[qt]==6.2.1",
    "pyyaml==6.0.3",
    "tomli-w==1.2.0",
    "watchdog==6.0.0",
]

[project.scripts]
paper-pile = "paper_pile.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["nicegui_main_file(path): main file for NiceGUI User tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# fixtures are data (ruff would reformat the code in their .md files)
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["paper_pile/core"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
]
